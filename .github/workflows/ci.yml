name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  # The fffleet detection worker image (docker/detect-worker.Dockerfile). Built and smoke-tested on every
  # PR; pushed to ghcr.io/<owner>/piperception-detect-worker on main.
  detect-worker-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/detect-worker.Dockerfile
          load: true
          tags: piperception-detect-worker:ci
      - name: Smoke test (executor loads, YOLOX runs on onnxruntime CPU)
        run: |
          docker run --rm piperception-detect-worker:ci node --input-type=module -e "
            const ex = (await import('/app/dist/fleet/detect-executor.js')).default;
            if (ex.type !== 'perception-detect') throw new Error('wrong type ' + ex.type);
            const { OnnxDetector } = await import('/app/dist/detector/onnx-backend.js');
            for (const m of ['yolox_nano', 'yolox_tiny']) {
              const d = new OnnxDetector({ modelPath: '/models/' + m + '.onnx' });
              const t0 = Date.now();
              const dets = await d.detect({ cameraId: 'c', tsMs: 0, format: 'rgb24', width: 640, height: 480, data: Buffer.alloc(640 * 480 * 3, 114) });
              console.log(m, 'ok', dets.length, 'detections on a grey frame,', Date.now() - t0, 'ms incl. warm-up');
            }"
          docker run --rm piperception-detect-worker:ci ffmpeg -hide_banner -version | head -1
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/detect-worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/piperception-detect-worker:latest
            ghcr.io/${{ github.repository_owner }}/piperception-detect-worker:${{ github.sha }}
